; 打包配置 —— 修复黑屏根因：
; 代码用字符串路径运行时 LoadClass/LoadObject 动态加载资产
; (WBP_MainMenu / DA_StoneConfig / DA_QuestConfig / WBP_Backpack 等)，
; 编辑器 cook 依赖扫描扫不到这些字符串引用 → 资产不进包 → 运行时找不到 → 黑屏。
; DirectoriesToAlwaysCook 强制整个 JadeBetting 目录进包（含 Level/*.umap 玩法关卡）。
; 段名固定为 /Script/UnrealEd.ProjectPackagingSettings
; (UProjectPackagingSettings::OverrideConfigSection 强制回写旧名)。
; 注意：FDirectoryPath/FFilePath 是结构体，ini 值必须带 (Path="...") 括号，
; 裸字符串会触发 ImportText "Missing opening parenthesis" → 配置静默失效。
